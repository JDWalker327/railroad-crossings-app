name: Android Release

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bootstrap mode: generate a NEW signing keystore (run once, then add the secrets)"
        type: boolean
        default: false

jobs:
  bootstrap-keystore:
    if: ${{ inputs.bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate signing keystore
        run: |
          PASS="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA -keysize 2048 -validity 10750 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Railroad Crossings App, OU=Mobile, O=Railroad Crossings, C=US"
          keytool -export -rfc -alias android -file upload_certificate.pem -keystore android.keystore -storepass "$PASS"
          base64 -w0 android.keystore > android-keystore-base64.txt
          printf '%s' "$PASS" > keystore-password.txt

      - name: Upload bootstrap files
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-bootstrap
          path: |
            android-keystore-base64.txt
            upload_certificate.pem
            keystore-password.txt

  build-app-bundle:
    if: ${{ !inputs.bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install --no-save @bubblewrap/cli@latest

      - name: Seed Bubblewrap config and accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing. Run this workflow once with the bootstrap checkbox, download the android-signing-bootstrap artifact, then add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD as repository secrets and run again."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Build signed Android App Bundle
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build-twa
          cp android.keystore build-twa/android.keystore
          node -e "
            const fs = require('fs');
            const manifest = require('./twa-manifest.json');
            manifest.signingKey = { path: './android.keystore', alias: 'android' };
            fs.writeFileSync('build-twa/twa-manifest.json', JSON.stringify(manifest, null, 2));
          "
          cd build-twa
          npx --no-install bubblewrap update --skipVersionUpgrade
          npx --no-install bubblewrap build --skipPwaValidation

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: |
            build-twa/app-release-bundle.aab
            build-twa/app-release-signed.apk
          if-no-files-found: error
