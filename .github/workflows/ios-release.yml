name: iOS TestFlight Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Assemble www/ from the web app
        run: node scripts/ios/build-www.js

      - name: Install Capacitor and image tools
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7 sharp

      - name: Add iOS platform
        run: npx cap add ios

      - name: Raise iOS deployment target
        run: |
          sed -i '' -e "s/platform :ios, '13.0'/platform :ios, '15.0'/" -e "s/platform :ios, '14.0'/platform :ios, '15.0'/" ios/App/Podfile
          sed -i '' -e 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' -e 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/' ios/App/App.xcodeproj/project.pbxproj

      - name: Patch iOS project (version, permissions, app icon)
        env:
          APP_VERSION: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: node scripts/ios/patch-ios.js

      - name: Sync web assets into the iOS project
        run: npx cap sync ios

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          BUNDLE_ID: com.rail1.crossings
          APP_NAME: "Railroad Crossings App"
        run: |
          echo "$ASC_KEY_P8_B64" | base64 --decode > /tmp/ASC_AuthKey.p8
          export APP_STORE_CONNECT_API_KEY_KEY_ID="$ASC_KEY_ID"
          export APP_STORE_CONNECT_API_KEY_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_API_KEY_KEY_FILEPATH=/tmp/ASC_AuthKey.p8
          fastlane ios beta
