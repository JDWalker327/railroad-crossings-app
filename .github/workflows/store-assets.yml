name: Store Assets

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live app URL to capture from"
        required: false
        default: "https://railroad-crossings-app.vercel.app/"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture screenshots and preview videos
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: node scripts/store-assets.js

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Upscale previews to App Store resolution
        run: |
          mkdir -p store-assets/previews
          for f in store-assets/videos-raw/*.mp4; do
            name=$(basename "$f" .mp4)
            ffmpeg -y -i "$f" -vf "scale=1290:2796:flags=neighbor" -r 30 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "store-assets/previews/$name.mp4"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: store-assets
          path: store-assets